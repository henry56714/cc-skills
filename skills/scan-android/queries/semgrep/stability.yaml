rules:
  # ============================================================
  # R-STB-001: Cursor 未关闭（函数内检查）
  # ============================================================
  - id: scan-android-r-stb-001-cursor-not-closed-java
    languages: [java]
    severity: WARNING
    message: "R-STB-001: rawQuery/query 返回 Cursor，需确认所有路径都关闭了它"
    patterns:
      - pattern: |
          $CURSOR = $DB.$QUERY(...);
          ...
      - pattern-not: |
          $CURSOR = $DB.$QUERY(...);
          ...
          $CURSOR.close();
      - pattern-not: |
          try ($CURSOR = $DB.$QUERY(...)) { ... }
      - metavariable-regex:
          metavariable: $QUERY
          regex: "^(rawQuery|query)$"
    paths:
      include:
        - "**/*.java"
    metadata:
      rule_id: R-STB-001
      category: stability/resource-leak-cursor
      severity: major

  # ============================================================
  # R-STB-002: Stream 未关闭
  # ============================================================
  - id: scan-android-r-stb-002-stream-not-closed-java
    languages: [java]
    severity: WARNING
    message: "R-STB-002: Stream 创建后需确认在所有路径都关闭"
    patterns:
      - pattern: |
          $S = new $STREAM($ARGS);
          ...
      - pattern-not: |
          try ($S = new $STREAM($ARGS)) { ... }
      - pattern-not: |
          $S = new $STREAM($ARGS);
          ...
          $S.close();
      - metavariable-regex:
          metavariable: $STREAM
          regex: "^(FileInputStream|FileOutputStream|BufferedReader|BufferedWriter|FileReader|FileWriter|InputStreamReader)$"
    paths:
      include:
        - "**/*.java"
    metadata:
      rule_id: R-STB-002
      category: stability/resource-leak-stream
      severity: major

  # ============================================================
  # R-STB-003: BroadcastReceiver/Listener 未注销
  # ============================================================
  - id: scan-android-r-stb-003-listener-not-unregistered
    languages: [java, kotlin]
    severity: WARNING
    message: "R-STB-003: 注册了 Receiver/Observer/Listener，需确认在所有生命周期退出路径都注销"
    pattern-regex: '\b(registerReceiver|registerContentObserver|registerListener|addCallback|addListener)\s*\('
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    metadata:
      rule_id: R-STB-003
      category: stability/listener-leak
      severity: major

  # ============================================================
  # R-STB-004: 静态字段持有 Context/Activity/View
  # ============================================================
  - id: scan-android-r-stb-004-static-context-leak-java
    languages: [java]
    severity: ERROR
    message: "R-STB-004: 静态字段持有 Context/Activity/View 导致内存泄漏"
    patterns:
      - pattern-either:
          - pattern: static Context $FIELD;
          - pattern: static Activity $FIELD;
          - pattern: static View $FIELD;
          - pattern: static Fragment $FIELD;
          - pattern: static Dialog $FIELD;
          - pattern: static final Context $FIELD = ...;
          - pattern: static final Activity $FIELD = ...;
          - pattern: static final View $FIELD = ...;
    paths:
      include:
        - "**/*.java"
    metadata:
      rule_id: R-STB-004
      category: stability/static-context-leak
      severity: critical

  - id: scan-android-r-stb-004-static-context-leak-kt
    languages: [kotlin]
    severity: ERROR
    message: "R-STB-004: companion object 或顶层属性持有 Context/Activity/View"
    patterns:
      - pattern-either:
          - pattern: |
              companion object {
                ...
                var $FIELD: Context = ...
                ...
              }
          - pattern: |
              companion object {
                ...
                var $FIELD: Activity = ...
                ...
              }
          - pattern: |
              companion object {
                ...
                var $FIELD: View = ...
                ...
              }
    paths:
      include:
        - "**/*.kt"
    metadata:
      rule_id: R-STB-004
      category: stability/static-context-leak
      severity: critical

  # ============================================================
  # R-STB-005: 非静态内部 Handler/Runnable/AsyncTask
  # ============================================================
  - id: scan-android-r-stb-005-inner-handler-java
    languages: [java]
    severity: WARNING
    message: "R-STB-005: 匿名/非静态内部 Handler 或 Runnable 持有外部类引用，可能导致内存泄漏"
    patterns:
      - pattern-either:
          - pattern: new Handler() { ... }
          - pattern: new Handler($L) { ... }
          - pattern: new Runnable() { ... }
    paths:
      include:
        - "**/*.java"
    metadata:
      rule_id: R-STB-005
      category: stability/inner-class-leak
      severity: major

  # ============================================================
  # R-STB-006: AsyncTask 已弃用
  # ============================================================
  - id: scan-android-r-stb-006-asynctask-deprecated
    languages: [java, kotlin]
    severity: INFO
    message: "R-STB-006: AsyncTask 已在 API 30 弃用，建议迁移到 coroutines/Executor"
    patterns:
      - pattern-either:
          - pattern: class $C extends AsyncTask<$A, $B, $D> { ... }
          - pattern: new AsyncTask<$A, $B, $D>() { ... }
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    metadata:
      rule_id: R-STB-006
      category: stability/deprecated-asynctask
      severity: minor

  # ============================================================
  # R-STB-007: 未命名线程创建
  # ============================================================
  - id: scan-android-r-stb-007-unnamed-thread
    languages: [java, kotlin]
    severity: INFO
    message: "R-STB-007: 创建未命名线程，生产 ANR/crash 分析困难"
    patterns:
      - pattern-either:
          - pattern: new Thread($R).start()
          - pattern: Executors.newFixedThreadPool($N)
          - pattern: Executors.newCachedThreadPool()
          - pattern: Executors.newSingleThreadExecutor()
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    metadata:
      rule_id: R-STB-007
      category: stability/unnamed-thread
      severity: minor

  # ============================================================
  # R-STB-008: 空 catch/吞异常
  # ============================================================
  - id: scan-android-r-stb-008-empty-catch-java
    languages: [java]
    severity: WARNING
    message: "R-STB-008: 空 catch 块，异常被静默吞掉"
    pattern: |
      try {
        ...
      } catch ($E $EX) {
      }
    paths:
      include:
        - "**/*.java"
    metadata:
      rule_id: R-STB-008
      category: stability/swallowed-exception
      severity: major

  - id: scan-android-r-stb-008-empty-catch-kt
    languages: [kotlin]
    severity: WARNING
    message: "R-STB-008: 空 catch 块，异常被静默吞掉"
    pattern: |
      try {
        ...
      } catch ($E: $EX) {
      }
    paths:
      include:
        - "**/*.kt"
    metadata:
      rule_id: R-STB-008
      category: stability/swallowed-exception
      severity: major

  # ============================================================
  # R-STB-009: RxJava Disposable 未管理
  # ============================================================
  - id: scan-android-r-stb-009-rxjava-disposable
    languages: [java, kotlin]
    severity: WARNING
    message: "R-STB-009: subscribe() 返回的 Disposable 可能未加入 CompositeDisposable"
    pattern-regex: '\.subscribe\s*\('
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    metadata:
      rule_id: R-STB-009
      category: stability/rxjava-disposable-leak
      severity: major

  # ============================================================
  # R-STB-010: SharedPreferences.commit()（同步 I/O）
  # ============================================================
  - id: scan-android-r-stb-010-sp-commit-sync
    languages: [java, kotlin]
    severity: INFO
    message: "R-STB-010: SharedPreferences.commit() 是同步 I/O，建议改用 apply()"
    pattern: $EDITOR.commit()
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    metadata:
      rule_id: R-STB-010
      category: stability/sp-commit-sync
      severity: minor

  # ============================================================
  # R-STB-011: commitAllowingStateLoss
  # ============================================================
  - id: scan-android-r-stb-011-commit-allowing-state-loss
    languages: [java, kotlin]
    severity: WARNING
    message: "R-STB-011: commitAllowingStateLoss() 通常掩盖生命周期 bug"
    patterns:
      - pattern-either:
          - pattern: $FM.commitAllowingStateLoss()
          - pattern: $FT.commitAllowingStateLoss()
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    metadata:
      rule_id: R-STB-011
      category: stability/fragment-state-loss
      severity: major

  # ============================================================
  # R-STB-012: Kotlin !! 操作符
  # ============================================================
  - id: scan-android-r-stb-012-not-null-assert
    languages: [kotlin]
    severity: INFO
    message: "R-STB-012: !! 操作符，对 platform 类型或可空链使用时会在运行时抛 NPE"
    pattern-regex: '!!(?![=])'
    paths:
      include:
        - "**/*.kt"
      exclude:
        - "**/test/**"
        - "**/androidTest/**"
    metadata:
      rule_id: R-STB-012
      category: stability/kotlin-not-null-assert
      severity: minor

  # ============================================================
  # R-STB-013: GlobalScope.launch
  # ============================================================
  - id: scan-android-r-stb-013-globalscope
    languages: [kotlin]
    severity: WARNING
    message: "R-STB-013: GlobalScope.launch/async 比创建它的组件活得更久，导致泄漏"
    patterns:
      - pattern-either:
          - pattern: GlobalScope.launch { ... }
          - pattern: GlobalScope.async { ... }
    paths:
      include:
        - "**/*.kt"
    metadata:
      rule_id: R-STB-013
      category: stability/globalscope
      severity: major

  # ============================================================
  # R-STB-014: 在错误对象上 synchronized
  # ============================================================
  - id: scan-android-r-stb-014-wrong-lock-object-java
    languages: [java]
    severity: ERROR
    message: "R-STB-014: 对 Boolean/Integer 字面量或字符串字面量加锁，可能导致跨类竞争"
    patterns:
      - pattern-either:
          - pattern: synchronized(Boolean.TRUE) { ... }
          - pattern: synchronized(Boolean.FALSE) { ... }
          - pattern: synchronized(Integer.valueOf($N)) { ... }
          - pattern: synchronized("...") { ... }
          - pattern: synchronized(true) { ... }
          - pattern: synchronized(false) { ... }
    paths:
      include:
        - "**/*.java"
    metadata:
      rule_id: R-STB-014
      category: stability/wrong-lock-object
      severity: critical

  # ============================================================
  # R-STB-016: WakeLock acquire 未确保 release
  # ============================================================
  - id: scan-android-r-stb-016-wakelock-acquire
    languages: [java, kotlin]
    severity: WARNING
    message: "R-STB-016: WakeLock.acquire()，需确认所有路径都在 finally 中调用了 release()"
    pattern: $WAKELOCK.acquire(...)
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    metadata:
      rule_id: R-STB-016
      category: stability/wakelock-leak
      severity: major

  # ============================================================
  # R-STB-017: runOnUiThread / Handler(mainLooper).post 无生命周期守护
  # ============================================================
  - id: scan-android-r-stb-017-async-ui-update
    languages: [java, kotlin]
    severity: WARNING
    message: "R-STB-017: runOnUiThread/mainLooper.post，需确认 Activity 未销毁"
    patterns:
      - pattern-either:
          - pattern: $A.runOnUiThread(...)
          - pattern: new Handler(Looper.getMainLooper()).post(...)
          - pattern: Handler(Looper.getMainLooper()).post(...)
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    metadata:
      rule_id: R-STB-017
      category: stability/async-ui-update
      severity: major

  # ============================================================
  # R-STB-020: Room 破坏性回退
  # ============================================================
  - id: scan-android-r-stb-020-room-destructive-migration
    languages: [java, kotlin]
    severity: ERROR
    message: "R-STB-020: fallbackToDestructiveMigration() 在 schema 不匹配时会清空所有数据"
    patterns:
      - pattern-either:
          - pattern: $BUILDER.fallbackToDestructiveMigration()
          - pattern: $BUILDER.fallbackToDestructiveMigration(...)
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    metadata:
      rule_id: R-STB-020
      category: stability/room-migration
      severity: critical

  # ============================================================
  # R-STB-024: UncaughtExceptionHandler 内高风险操作
  # ============================================================
  - id: scan-android-r-stb-024-crash-handler
    languages: [java, kotlin]
    severity: ERROR
    message: "R-STB-024: 实现 UncaughtExceptionHandler，需确认 handler 内部不会再次抛出异常"
    pattern-regex: 'UncaughtExceptionHandler|setDefaultUncaughtExceptionHandler'
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    metadata:
      rule_id: R-STB-024
      category: stability/crash-handler-recursion
      severity: critical

  # ============================================================
  # R-STB-026: AIDL backward compat
  # ============================================================
  - id: scan-android-r-stb-026-aidl-backward-compat
    languages: [java, kotlin]
    severity: ERROR
    message: "R-STB-026: AIDL 接口定义，新增方法必须追加到末尾"
    pattern-regex: 'interface\s+[A-Za-z_]\w*'
    paths:
      include:
        - "**/aidl/**/*.java"
        - "**/aidl/**/*.kt"
        - "**/*Stub*.java"
        - "**/*Aidl*.java"
    metadata:
      rule_id: R-STB-026
      category: stability/aidl-backward-compat
      severity: critical

  # ============================================================
  # R-STB-027: AIDL 方法抛受检异常
  # ============================================================
  - id: scan-android-r-stb-027-aidl-checked-exception
    languages: [java, kotlin]
    severity: WARNING
    message: "R-STB-027: AIDL 方法声明 throws 非 RemoteException 的受检异常，可能被 Binder 吞掉"
    pattern-regex: 'throws\s+[A-Z]\w+Exception'
    paths:
      include:
        - "**/aidl/**/*.java"
        - "**/aidl/**/*.kt"
        - "**/*Stub*.java"
        - "**/*Aidl*.java"
    metadata:
      rule_id: R-STB-027
      category: stability/aidl-checked-exception
      severity: major

  # ============================================================
  # R-STB-028: startForegroundService 后未及时 startForeground
  # ============================================================
  - id: scan-android-r-stb-028-fgs-start-timeout
    languages: [java, kotlin]
    severity: ERROR
    message: "R-STB-028: startForegroundService() 调用后，目标 Service 必须在 5s 内调用 startForeground()"
    patterns:
      - pattern-either:
          - pattern: $CTX.startForegroundService(...)
          - pattern: ContextCompat.startForegroundService(...)
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    metadata:
      rule_id: R-STB-028
      category: stability/fgs-start-timeout
      severity: critical

  # ============================================================
  # R-STB-029: 前台服务缺少 foregroundServiceType
  # ============================================================
  - id: scan-android-r-stb-029-fgs-type-missing
    languages: [java, kotlin]
    severity: ERROR
    message: "R-STB-029: startForeground() 调用，targetSdk>=34 需要在 manifest 声明 foregroundServiceType"
    pattern: $S.startForeground($ID, $NOTIF)
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    metadata:
      rule_id: R-STB-029
      category: stability/fgs-type-missing
      severity: critical

  # ============================================================
  # R-STB-030: 非线程安全 formatter 作共享实例
  # ============================================================
  - id: scan-android-r-stb-030-non-threadsafe-formatter
    languages: [java]
    severity: WARNING
    message: "R-STB-030: SimpleDateFormat/DecimalFormat 非线程安全，不应作为 static 共享实例"
    patterns:
      - pattern-either:
          - pattern: static SimpleDateFormat $F = ...;
          - pattern: static final SimpleDateFormat $F = ...;
          - pattern: static DecimalFormat $F = ...;
          - pattern: static final DecimalFormat $F = ...;
          - pattern: static NumberFormat $F = ...;
    paths:
      include:
        - "**/*.java"
    metadata:
      rule_id: R-STB-030
      category: stability/non-threadsafe-formatter
      severity: major

  # ============================================================
  # R-STB-032: Fragment 中 LiveData observe 用 this
  # ============================================================
  - id: scan-android-r-stb-032-livedata-wrong-owner
    languages: [java, kotlin]
    severity: WARNING
    message: "R-STB-032: Fragment 中使用 this 作为 LiveData observe 的 owner，应改用 viewLifecycleOwner"
    pattern: $LIVEDATA.observe(this, $OBSERVER)
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    metadata:
      rule_id: R-STB-032
      category: stability/livedata-wrong-owner
      severity: major
