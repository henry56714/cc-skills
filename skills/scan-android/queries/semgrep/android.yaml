# scan-android 本地补充 Semgrep 规则（社区库未覆盖的 Android/项目特定项）。
# 全部规则集中于此文件，不再按维度分文件。
rules:
- id: scan-android-r-sec-001-hardcoded-secret-java
  languages:
  - java
  - kotlin
  severity: ERROR
  message: 'R-SG-001: 检测到可能的硬编码密钥'
  pattern-regex: (?i)\b(api[_\-]?key|secret|password|access[_\-]?key|private[_\-]?key|auth[_\-]?token|bearer)\s*[:=]\s*"[^"]{8,}"
  paths:
    include:
    - '**/*.java'
    - '**/*.kt'
    exclude:
    - '**/test/**'
    - '**/androidTest/**'
    - '**/*.example.*'
    - '**/*Test*'
  metadata:
    rule_id: R-SG-001
    category: security/hardcoded-secret
    severity: critical
- id: scan-android-r-sec-001-hardcoded-secret-props
  languages:
  - yaml
  severity: ERROR
  message: 'R-SG-001: 检测到可能的硬编码密钥（properties/gradle 文件）'
  pattern-regex: (?i)(api[_\-]?key|secret|password|access[_\-]?key|private[_\-]?key|auth[_\-]?token|bearer)\s*[=:]\s*[^\s]{8,}
  paths:
    include:
    - '**/*.properties'
    - '**/*.gradle'
    - '**/*.gradle.kts'
    exclude:
    - '**/test/**'
  metadata:
    rule_id: R-SG-001
    category: security/hardcoded-secret
    severity: critical
- id: scan-android-r-sec-002-weak-crypto
  languages:
  - java
  - kotlin
  severity: ERROR
  message: 'R-SG-002: 使用弱加密或弱哈希算法'
  pattern: $X.getInstance("...")
  metavariable-regex:
    metavariable: '...'
    regex: ^(DES|RC4|MD5|SHA-?1|AES/ECB/.*)
  paths:
    include:
    - '**/*.java'
    - '**/*.kt'
  metadata:
    rule_id: R-SG-002
    category: security/weak-crypto
    severity: critical
- id: scan-android-r-sec-003-trust-all-java
  languages:
  - java
  severity: ERROR
  message: 'R-SG-003: checkServerTrusted 方法体为空，信任所有证书'
  pattern: 'public void checkServerTrusted(java.security.cert.X509Certificate[] $CHAIN, String $TYPE) throws java.security.cert.CertificateException {

    }

    '
  paths:
    include:
    - '**/*.java'
  metadata:
    rule_id: R-SG-003
    category: security/tls-trust-all
    severity: critical
- id: scan-android-r-sec-003-trust-all-kt
  languages:
  - kotlin
  severity: ERROR
  message: 'R-SG-003: checkServerTrusted 实现为空，信任所有证书'
  pattern: 'override fun checkServerTrusted($CHAIN: Array<java.security.cert.X509Certificate>, $TYPE: String) {

    }

    '
  paths:
    include:
    - '**/*.kt'
  metadata:
    rule_id: R-SG-003
    category: security/tls-trust-all
    severity: critical
- id: scan-android-r-sec-003-hostname-verifier
  languages:
  - java
  - kotlin
  severity: ERROR
  message: 'R-SG-003: HostnameVerifier 永久返回 true'
  pattern-regex: HostnameVerifier[^{]*\{[^}]*return\s+true
  paths:
    include:
    - '**/*.java'
    - '**/*.kt'
  metadata:
    rule_id: R-SG-003
    category: security/tls-trust-all
    severity: critical
- id: scan-android-r-sec-004-webview-js-enabled
  languages:
  - java
  - kotlin
  severity: WARNING
  message: 'R-SG-004: WebView 开启了 JavaScript'
  patterns:
  - pattern: $WEBVIEW.getSettings().setJavaScriptEnabled(true)
  paths:
    include:
    - '**/*.java'
    - '**/*.kt'
  metadata:
    rule_id: R-SG-004
    category: security/webview
    severity: major
- id: scan-android-r-sec-004-webview-file-access
  languages:
  - java
  - kotlin
  severity: ERROR
  message: 'R-SG-004: WebView 允许文件访问'
  patterns:
  - pattern-either:
    - pattern: $WS.setAllowFileAccess(true)
    - pattern: $WS.setAllowFileAccessFromFileURLs(true)
    - pattern: $WS.setAllowUniversalAccessFromFileURLs(true)
  paths:
    include:
    - '**/*.java'
    - '**/*.kt'
  metadata:
    rule_id: R-SG-004
    category: security/webview
    severity: major
- id: scan-android-r-sec-004-webview-addjavascript-interface
  languages:
  - java
  - kotlin
  severity: WARNING
  message: 'R-SG-004: addJavascriptInterface 暴露 Java 对象到 WebView'
  pattern: $WV.addJavascriptInterface(...)
  paths:
    include:
    - '**/*.java'
    - '**/*.kt'
  metadata:
    rule_id: R-SG-004
    category: security/webview
    severity: major
- id: scan-android-r-sec-004-webview-ssl-error-proceed
  languages:
  - java
  - kotlin
  severity: ERROR
  message: 'R-SG-004: onReceivedSslError 中调用 handler.proceed()，忽略 TLS 证书错误'
  pattern-regex: onReceivedSslError[\s\S]{0,400}?\.proceed\s*\(
  paths:
    include:
    - '**/*.java'
    - '**/*.kt'
  metadata:
    rule_id: R-SG-004
    category: security/webview
    severity: critical
- id: scan-android-r-sec-004-webview-debugging-enabled
  languages:
  - java
  - kotlin
  severity: WARNING
  message: 'R-SG-004: setWebContentsDebuggingEnabled(true) 在 release 中暴露 WebView 调试接口'
  patterns:
  - pattern-either:
    - pattern: WebView.setWebContentsDebuggingEnabled(true)
    - pattern: $WV.setWebContentsDebuggingEnabled(true)
  paths:
    include:
    - '**/*.java'
    - '**/*.kt'
  metadata:
    rule_id: R-SG-004
    category: security/webview
    severity: major
- id: scan-android-r-sec-004-webview-load-data-base-url
  languages:
  - java
  - kotlin
  severity: WARNING
  message: 'R-SG-004: loadDataWithBaseURL 调用，需确认 baseUrl/data 不可被外部控制（否则任意域 XSS）'
  pattern: $WV.loadDataWithBaseURL(...)
  paths:
    include:
    - '**/*.java'
    - '**/*.kt'
  metadata:
    rule_id: R-SG-004
    category: security/webview
    severity: major
- id: scan-android-r-sec-005-cleartext-traffic-manifest
  languages:
  - xml
  severity: WARNING
  message: 'R-SG-005: manifest 中 usesCleartextTraffic=true'
  pattern-regex: android:usesCleartextTraffic\s*=\s*"true"
  paths:
    include:
    - '**/AndroidManifest.xml'
    - '**/network_security_config.xml'
  metadata:
    rule_id: R-SG-005
    category: security/cleartext
    severity: major
- id: scan-android-r-sec-005-cleartext-http-url
  languages:
  - java
  - kotlin
  severity: WARNING
  message: 'R-SG-005: 代码中存在 HTTP 明文 URL'
  pattern-regex: '"http://[^"]{4,}"'
  paths:
    include:
    - '**/*.java'
    - '**/*.kt'
  metadata:
    rule_id: R-SG-005
    category: security/cleartext
    severity: major
- id: scan-android-r-sec-006-pendingintent-mutability
  languages:
  - java
  - kotlin
  severity: WARNING
  message: 'R-SG-006: PendingIntent 调用，需确认 FLAG_IMMUTABLE 或 FLAG_MUTABLE'
  patterns:
  - pattern-either:
    - pattern: PendingIntent.getActivity(...)
    - pattern: PendingIntent.getBroadcast(...)
    - pattern: PendingIntent.getService(...)
    - pattern: PendingIntent.getActivities(...)
  paths:
    include:
    - '**/*.java'
    - '**/*.kt'
  metadata:
    rule_id: R-SG-006
    category: security/pendingintent-mutability
    severity: major
- id: scan-android-r-sec-007-exported-unprotected
  languages:
  - xml
  severity: ERROR
  message: 'R-SG-007: 组件设置 exported=true，需确认是否有权限保护'
  pattern-regex: android:exported\s*=\s*"true"
  paths:
    include:
    - '**/AndroidManifest.xml'
  metadata:
    rule_id: R-SG-007
    category: security/exported-unprotected
    severity: critical
- id: scan-android-r-sec-008-world-readable
  languages:
  - java
  - kotlin
  severity: ERROR
  message: 'R-SG-008: 使用已废弃的 MODE_WORLD_READABLE/WRITEABLE'
  pattern-regex: MODE_WORLD_(READABLE|WRITEABLE)
  paths:
    include:
    - '**/*.java'
    - '**/*.kt'
  metadata:
    rule_id: R-SG-008
    category: security/world-readable
    severity: critical
- id: scan-android-r-sec-009-weak-random-java
  languages:
  - java
  severity: WARNING
  message: 'R-SG-009: 使用 java.util.Random，可能不适合安全用途'
  pattern: new Random()
  paths:
    include:
    - '**/*.java'
    - '**/*.kt'
  metadata:
    rule_id: R-SG-009
    category: security/weak-random
    severity: major
- id: scan-android-r-sec-009-math-random
  languages:
  - java
  - kotlin
  severity: WARNING
  message: 'R-SG-009: Math.random() 不适合安全用途'
  pattern: Math.random()
  paths:
    include:
    - '**/*.java'
    - '**/*.kt'
  metadata:
    rule_id: R-SG-009
    category: security/weak-random
    severity: major
- id: scan-android-r-sec-010-log-leakage
  languages:
  - java
  - kotlin
  severity: WARNING
  message: 'R-SG-010: 日志中可能包含敏感数据（token/password/location 等）'
  pattern-regex: \bLog\.(v|d|i|w|e|wtf)\s*\([^)]*\b(vin|imei|token|password|phone|latitude|longitude|location|uid|deviceId|mac)\b
  paths:
    include:
    - '**/*.java'
    - '**/*.kt'
  metadata:
    rule_id: R-SG-010
    category: security/log-leakage
    severity: major
- id: scan-android-r-sec-011-sql-injection-java
  languages:
  - java
  severity: ERROR
  message: 'R-SG-011: rawQuery/execSQL 使用字符串拼接，可能存在 SQL 注入'
  patterns:
  - pattern-either:
    - pattern: $DB.rawQuery("..." + $X, $ARGS)
    - pattern: $DB.execSQL("..." + $X)
    - pattern: $DB.rawQuery($SQL + $X, $ARGS)
    - pattern: $DB.execSQL($SQL + $X)
  paths:
    include:
    - '**/*.java'
  metadata:
    rule_id: R-SG-011
    category: security/sql-injection
    severity: critical
- id: scan-android-r-sec-011-sql-injection-kt
  languages:
  - kotlin
  severity: ERROR
  message: 'R-SG-011: rawQuery/execSQL 使用字符串拼接或模板，可能存在 SQL 注入'
  patterns:
  - pattern-either:
    - pattern: $DB.rawQuery("...$X...", $ARGS)
    - pattern: $DB.execSQL("...$X...")
    - pattern: $DB.rawQuery($SQL + $X, $ARGS)
  paths:
    include:
    - '**/*.kt'
  metadata:
    rule_id: R-SG-011
    category: security/sql-injection
    severity: critical
- id: scan-android-r-sec-012-command-injection
  languages:
  - java
  - kotlin
  severity: ERROR
  message: 'R-SG-012: Runtime.exec 或 ProcessBuilder 使用动态参数'
  patterns:
  - pattern-either:
    - pattern: Runtime.getRuntime().exec(...)
    - pattern: new ProcessBuilder(...)
  paths:
    include:
    - '**/*.java'
    - '**/*.kt'
  metadata:
    rule_id: R-SG-012
    category: security/command-injection
    severity: critical
- id: scan-android-r-sec-013-ipc-caller-unverified-java
  languages:
  - java
  severity: ERROR
  message: 'R-SG-013: AIDL Stub 实现，需确认所有特权方法都校验了调用方'
  pattern: class $C extends $IFACE.Stub { ... }
  paths:
    include:
    - '**/*.java'
  metadata:
    rule_id: R-SG-013
    category: security/ipc-caller-unverified
    severity: critical
- id: scan-android-r-sec-014-debuggable-manifest
  languages:
  - xml
  severity: ERROR
  message: 'R-SG-014: manifest 中 android:debuggable=true'
  pattern-regex: android:debuggable\s*=\s*"true"
  paths:
    include:
    - '**/AndroidManifest.xml'
  metadata:
    rule_id: R-SG-014
    category: security/debuggable-enabled
    severity: critical
- id: scan-android-r-sec-014-debuggable-gradle
  languages:
  - kotlin
  severity: ERROR
  message: 'R-SG-014: build.gradle 中 debuggable true（可能在 release buildType）'
  pattern-regex: ^\s*debuggable\s+true\b
  paths:
    include:
    - '**/*.gradle'
    - '**/*.gradle.kts'
  metadata:
    rule_id: R-SG-014
    category: security/debuggable-enabled
    severity: critical
- id: scan-android-r-sec-015-allow-backup
  languages:
  - xml
  severity: WARNING
  message: 'R-SG-015: android:allowBackup=true 允许 adb 导出私有数据'
  pattern-regex: android:allowBackup\s*=\s*"true"
  paths:
    include:
    - '**/AndroidManifest.xml'
  metadata:
    rule_id: R-SG-015
    category: security/backup-allowed
    severity: major
- id: scan-android-r-sec-016-intent-redirection
  languages:
  - java
  - kotlin
  severity: ERROR
  message: 'R-SG-016: 从 extra 中取出的对象可能被用作 Intent 转发（Intent 重定向）'
  patterns:
  - pattern-either:
    - pattern: $I.getParcelableExtra(...)
    - pattern: $I.getSerializableExtra(...)
  paths:
    include:
    - '**/*.java'
    - '**/*.kt'
  metadata:
    rule_id: R-SG-016
    category: security/intent-redirection
    severity: critical
- id: scan-android-r-sec-017-receiver-export-flag
  languages:
  - java
  - kotlin
  severity: WARNING
  message: 'R-SG-017: registerReceiver 调用，targetSdk>=34 需要明确传入 RECEIVER_EXPORTED 或 RECEIVER_NOT_EXPORTED'
  pattern-either:
  - pattern: $CTX.registerReceiver($R, $F)
  - pattern: $CTX.registerReceiver($R, $F, $PERM, $H)
  paths:
    include:
    - '**/*.java'
    - '**/*.kt'
  metadata:
    rule_id: R-SG-017
    category: security/receiver-export-flag
    severity: major
- id: scan-android-r-sec-018-exported-provider
  languages:
  - xml
  severity: ERROR
  message: 'R-SG-018: ContentProvider 设置 exported=true，需确认是否有权限保护'
  pattern-regex: <provider\b[^>]*android:exported\s*=\s*"true"
  paths:
    include:
    - '**/AndroidManifest.xml'
  metadata:
    rule_id: R-SG-018
    category: security/exported-provider
    severity: critical
- id: scan-android-r-sec-019-unsafe-deserialize
  languages:
  - java
  - kotlin
  severity: WARNING
  message: 'R-SG-019: ObjectInputStream 反序列化，需确认输入来源是否可信'
  pattern: new ObjectInputStream(...)
  paths:
    include:
    - '**/*.java'
    - '**/*.kt'
  metadata:
    rule_id: R-SG-019
    category: security/unsafe-deserialization
    severity: major
- id: scan-android-r-sec-019-dynamic-dex-load
  languages:
  - java
  - kotlin
  severity: ERROR
  message: 'R-SG-019: 动态代码加载（DexClassLoader），需确认来源安全性'
  patterns:
  - pattern-either:
    - pattern: new DexClassLoader(...)
    - pattern: new InMemoryDexClassLoader(...)
    - pattern: System.load(...)
  paths:
    include:
    - '**/*.java'
    - '**/*.kt'
  metadata:
    rule_id: R-SG-019
    category: security/unsafe-deserialization
    severity: critical
- id: scan-android-r-sec-020-sensitive-external-storage
  languages:
  - java
  - kotlin
  severity: WARNING
  message: 'R-SG-020: 使用外部存储路径，敏感数据不应写入外部存储'
  patterns:
  - pattern-either:
    - pattern: $CTX.getExternalStorageDirectory()
    - pattern: $CTX.getExternalStoragePublicDirectory(...)
    - pattern: $CTX.getExternalFilesDir(...)
    - pattern: $CTX.getExternalCacheDir()
    - pattern: Environment.getExternalStorageDirectory()
    - pattern: Environment.getExternalStoragePublicDirectory(...)
  paths:
    include:
    - '**/*.java'
    - '**/*.kt'
  metadata:
    rule_id: R-SG-020
    category: security/sensitive-external-storage
    severity: major
- id: scan-android-r-stb-001-cursor-not-closed-java
  languages:
  - java
  severity: WARNING
  message: 'R-SG-021: rawQuery/query 返回 Cursor，需确认所有路径都关闭了它'
  patterns:
  - pattern: '$CURSOR = $DB.$QUERY(...);

      ...

      '
  - pattern-not: '$CURSOR = $DB.$QUERY(...);

      ...

      $CURSOR.close();

      '
  - pattern-not: 'try ($CURSOR = $DB.$QUERY(...)) { ... }

      '
  - metavariable-regex:
      metavariable: $QUERY
      regex: ^(rawQuery|query)$
  paths:
    include:
    - '**/*.java'
  metadata:
    rule_id: R-SG-021
    category: stability/resource-leak-cursor
    severity: major
- id: scan-android-r-stb-002-stream-not-closed-java
  languages:
  - java
  severity: WARNING
  message: 'R-SG-022: Stream 创建后需确认在所有路径都关闭'
  patterns:
  - pattern: '$S = new $STREAM($ARGS);

      ...

      '
  - pattern-not: 'try ($S = new $STREAM($ARGS)) { ... }

      '
  - pattern-not: '$S = new $STREAM($ARGS);

      ...

      $S.close();

      '
  - metavariable-regex:
      metavariable: $STREAM
      regex: ^(FileInputStream|FileOutputStream|BufferedReader|BufferedWriter|FileReader|FileWriter|InputStreamReader)$
  paths:
    include:
    - '**/*.java'
  metadata:
    rule_id: R-SG-022
    category: stability/resource-leak-stream
    severity: major
- id: scan-android-r-stb-003-listener-not-unregistered
  languages:
  - java
  - kotlin
  severity: WARNING
  message: 'R-SG-023: 注册了 Receiver/Observer/Listener，需确认在所有生命周期退出路径都注销'
  pattern-regex: \b(registerReceiver|registerContentObserver|registerListener|addCallback|addListener)\s*\(
  paths:
    include:
    - '**/*.java'
    - '**/*.kt'
  metadata:
    rule_id: R-SG-023
    category: stability/listener-leak
    severity: major
- id: scan-android-r-stb-004-static-context-leak-java
  languages:
  - java
  severity: ERROR
  message: 'R-SG-024: 静态字段持有 Context/Activity/View 导致内存泄漏'
  patterns:
  - pattern-either:
    - pattern: static Context $FIELD;
    - pattern: static Activity $FIELD;
    - pattern: static View $FIELD;
    - pattern: static Fragment $FIELD;
    - pattern: static Dialog $FIELD;
    - pattern: static final Context $FIELD = ...;
    - pattern: static final Activity $FIELD = ...;
    - pattern: static final View $FIELD = ...;
  paths:
    include:
    - '**/*.java'
  metadata:
    rule_id: R-SG-024
    category: stability/static-context-leak
    severity: critical
- id: scan-android-r-stb-004-static-context-leak-kt
  languages:
  - kotlin
  severity: ERROR
  message: 'R-SG-024: companion object 或顶层属性持有 Context/Activity/View'
  patterns:
  - pattern-either:
    - pattern: "companion object {\n  ...\n  var $FIELD: Context = ...\n  ...\n}\n"
    - pattern: "companion object {\n  ...\n  var $FIELD: Activity = ...\n  ...\n}\n"
    - pattern: "companion object {\n  ...\n  var $FIELD: View = ...\n  ...\n}\n"
  paths:
    include:
    - '**/*.kt'
  metadata:
    rule_id: R-SG-024
    category: stability/static-context-leak
    severity: critical
- id: scan-android-r-stb-005-inner-handler-java
  languages:
  - java
  severity: WARNING
  message: 'R-SG-025: 匿名/非静态内部 Handler 或 Runnable 持有外部类引用，可能导致内存泄漏'
  patterns:
  - pattern-either:
    - pattern: new Handler() { ... }
    - pattern: new Handler($L) { ... }
    - pattern: new Runnable() { ... }
  paths:
    include:
    - '**/*.java'
  metadata:
    rule_id: R-SG-025
    category: stability/inner-class-leak
    severity: major
- id: scan-android-r-stb-006-asynctask-deprecated
  languages:
  - java
  - kotlin
  severity: INFO
  message: 'R-SG-026: AsyncTask 已在 API 30 弃用，建议迁移到 coroutines/Executor'
  patterns:
  - pattern-either:
    - pattern: class $C extends AsyncTask<$A, $B, $D> { ... }
    - pattern: new AsyncTask<$A, $B, $D>() { ... }
  paths:
    include:
    - '**/*.java'
    - '**/*.kt'
  metadata:
    rule_id: R-SG-026
    category: stability/deprecated-asynctask
    severity: minor
- id: scan-android-r-stb-007-unnamed-thread
  languages:
  - java
  - kotlin
  severity: INFO
  message: 'R-SG-027: 创建未命名线程，生产 ANR/crash 分析困难'
  patterns:
  - pattern-either:
    - pattern: new Thread($R).start()
    - pattern: Executors.newFixedThreadPool($N)
    - pattern: Executors.newCachedThreadPool()
    - pattern: Executors.newSingleThreadExecutor()
  paths:
    include:
    - '**/*.java'
    - '**/*.kt'
  metadata:
    rule_id: R-SG-027
    category: stability/unnamed-thread
    severity: minor
- id: scan-android-r-stb-008-empty-catch-java
  languages:
  - java
  severity: WARNING
  message: 'R-SG-028: 空 catch 块，异常被静默吞掉'
  pattern: "try {\n  ...\n} catch ($E $EX) {\n}\n"
  paths:
    include:
    - '**/*.java'
  metadata:
    rule_id: R-SG-028
    category: stability/swallowed-exception
    severity: major
- id: scan-android-r-stb-008-empty-catch-kt
  languages:
  - kotlin
  severity: WARNING
  message: 'R-SG-028: 空 catch 块，异常被静默吞掉'
  pattern: "try {\n  ...\n} catch ($E: $EX) {\n}\n"
  paths:
    include:
