rules:
  # ============================================================
  # R-PRF-001: 主线程文件 I/O
  # ============================================================
  - id: scan-android-r-prf-001-main-thread-io
    languages: [java, kotlin]
    severity: WARNING
    message: "R-PRF-001: 文件 I/O 操作，需确认不在主线程调用（会导致 ANR）"
    patterns:
      - pattern-either:
          - pattern: new FileInputStream(...)
          - pattern: new FileOutputStream(...)
          - pattern: new FileReader(...)
          - pattern: new FileWriter(...)
          - pattern: Files.readAllBytes(...)
          - pattern: Files.write(...)
          - pattern: Files.newInputStream(...)
          - pattern: Files.newOutputStream(...)
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    metadata:
      rule_id: R-PRF-001
      category: perf/main-thread-io
      severity: major

  # ============================================================
  # R-PRF-002: 主线程数据库访问
  # ============================================================
  - id: scan-android-r-prf-002-main-thread-db-allow-main
    languages: [java, kotlin]
    severity: ERROR
    message: "R-PRF-002: allowMainThreadQueries() 关闭了 Room 的主线程保护，可能导致 ANR"
    pattern: $BUILDER.allowMainThreadQueries()
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    metadata:
      rule_id: R-PRF-002
      category: perf/main-thread-db
      severity: major

  - id: scan-android-r-prf-002-main-thread-db-sqlite
    languages: [java, kotlin]
    severity: WARNING
    message: "R-PRF-002: SQLiteOpenHelper.getWritableDatabase/getReadableDatabase，需确认不在主线程同步调用"
    patterns:
      - pattern-either:
          - pattern: $HELPER.getWritableDatabase()
          - pattern: $HELPER.getReadableDatabase()
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    metadata:
      rule_id: R-PRF-002
      category: perf/main-thread-db
      severity: major

  # ============================================================
  # R-PRF-003: 主线程网络
  # ============================================================
  - id: scan-android-r-prf-003-main-thread-network-execute
    languages: [java, kotlin]
    severity: ERROR
    message: "R-PRF-003: Call.execute() 是同步网络调用，在主线程会导致 ANR 和 NetworkOnMainThreadException"
    patterns:
      - pattern: $CALL.execute()
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    metadata:
      rule_id: R-PRF-003
      category: perf/main-thread-network
      severity: critical

  - id: scan-android-r-prf-003-http-url-connection
    languages: [java, kotlin]
    severity: WARNING
    message: "R-PRF-003: HttpURLConnection 是同步网络，需确认不在主线程调用"
    pattern-regex: 'new\s+URL\s*\([^)]+\)\.openConnection'
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    metadata:
      rule_id: R-PRF-003
      category: perf/main-thread-network
      severity: critical

  # ============================================================
  # R-PRF-004: onDraw/热路径中的分配
  # ============================================================
  - id: scan-android-r-prf-004-ondraw-allocation-java
    languages: [java]
    severity: WARNING
    message: "R-PRF-004: onDraw 中分配了对象（Paint/Path/Rect等），每帧执行会产生 GC 压力"
    patterns:
      - pattern: new $OBJ(...)
      - pattern-inside: |
          protected void onDraw(Canvas $C) {
            ...
          }
    paths:
      include:
        - "**/*.java"
    metadata:
      rule_id: R-PRF-004
      category: perf/hotpath-allocation
      severity: major

  - id: scan-android-r-prf-004-ondraw-allocation-kt
    languages: [kotlin]
    severity: WARNING
    message: "R-PRF-004: onDraw 中分配对象，建议移到构造函数或 onSizeChanged"
    patterns:
      - pattern: $T(...)
      - pattern-inside: |
          override fun onDraw($C: Canvas) {
            ...
          }
    paths:
      include:
        - "**/*.kt"
    metadata:
      rule_id: R-PRF-004
      category: perf/hotpath-allocation
      severity: major

  # ============================================================
  # R-PRF-005: RecyclerView.Adapter.onBindViewHolder 中的 findViewById
  # ============================================================
  - id: scan-android-r-prf-005-rv-findviewbyid-java
    languages: [java]
    severity: WARNING
    message: "R-PRF-005: onBindViewHolder 中调用 findViewById，应在 onCreateViewHolder 中缓存"
    patterns:
      - pattern: $V.findViewById(...)
      - pattern-inside: |
          public void onBindViewHolder($VH $HOLDER, int $POS) {
            ...
          }
    paths:
      include:
        - "**/*.java"
    metadata:
      rule_id: R-PRF-005
      category: perf/rv-findviewbyid
      severity: major

  - id: scan-android-r-prf-005-rv-findviewbyid-kt
    languages: [kotlin]
    severity: WARNING
    message: "R-PRF-005: onBindViewHolder 中调用 findViewById，应缓存到 ViewHolder"
    patterns:
      - pattern: $V.findViewById(...)
      - pattern-inside: |
          override fun onBindViewHolder($HOLDER: $VH, $POS: Int) {
            ...
          }
    paths:
      include:
        - "**/*.kt"
    metadata:
      rule_id: R-PRF-005
      category: perf/rv-findviewbyid
      severity: major

  # ============================================================
  # R-PRF-008: 每次调用都重新编译 Regex
  # ============================================================
  - id: scan-android-r-prf-008-regex-recompile-java
    languages: [java]
    severity: INFO
    message: "R-PRF-008: Pattern.compile 在非 static 上下文，每次调用都会重新编译正则"
    patterns:
      - pattern: Pattern.compile("...")
      - pattern-not-inside: static $TYPE $VAR = Pattern.compile("...");
    paths:
      include:
        - "**/*.java"
    metadata:
      rule_id: R-PRF-008
      category: perf/regex-recompile
      severity: minor

  # ============================================================
  # R-PRF-010: Bitmap 解码不传 Options（OOM 风险）
  # ============================================================
  - id: scan-android-r-prf-010-bitmap-oom
    languages: [java, kotlin]
    severity: WARNING
    message: "R-PRF-010: BitmapFactory.decode* 未传 BitmapFactory.Options，大图会 OOM"
    patterns:
      - pattern-either:
          - pattern: BitmapFactory.decodeFile($PATH)
          - pattern: BitmapFactory.decodeResource($RES, $ID)
          - pattern: BitmapFactory.decodeStream($IS)
          - pattern: BitmapFactory.decodeByteArray($BYTES, $OFF, $LEN)
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    metadata:
      rule_id: R-PRF-010
      category: perf/bitmap-oom-risk
      severity: major

  # ============================================================
  # R-PRF-013: 循环内 inflate 布局
  # ============================================================
  - id: scan-android-r-prf-013-inflate-in-loop-java
    languages: [java]
    severity: WARNING
    message: "R-PRF-013: 循环内调用 LayoutInflater.inflate，代价高昂"
    patterns:
      - pattern: $INFLATER.inflate(...)
      - pattern-inside: |
          for (...) {
            ...
          }
    paths:
      include:
        - "**/*.java"
    metadata:
      rule_id: R-PRF-013
      category: perf/inflate-in-loop
      severity: major

  # ============================================================
  # R-PRF-014: SELECT *
  # ============================================================
  - id: scan-android-r-prf-014-select-star
    languages: [java, kotlin]
    severity: INFO
    message: "R-PRF-014: SELECT * 会读取所有列，宽表时浪费 I/O"
    pattern-regex: '"(?i)SELECT\s+\*'
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    metadata:
      rule_id: R-PRF-014
      category: perf/inefficient-sql
      severity: minor

  # ============================================================
  # R-PRF-015: 循环内逐条 DB 写入未包事务
  # ============================================================
  - id: scan-android-r-prf-015-db-write-no-transaction-java
    languages: [java]
    severity: WARNING
    message: "R-PRF-015: 循环内逐条 DB 写入未包事务，比批量事务慢一个数量级"
    patterns:
      - pattern: $DB.$METHOD(...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: "^(insert|insertOrThrow|insertWithOnConflict|execSQL|update|delete|replace)$"
      - pattern-inside: |
          for (...) {
            ...
          }
    paths:
      include:
        - "**/*.java"
    metadata:
      rule_id: R-PRF-015
      category: perf/db-write-no-transaction
      severity: major

  # ============================================================
  # R-PRF-016: BroadcastReceiver.onReceive 内做重活
  # ============================================================
  - id: scan-android-r-prf-016-heavy-onreceive-java
    languages: [java]
    severity: WARNING
    message: "R-PRF-016: onReceive 运行在主线程，其中不应有重 I/O 或耗时操作"
    patterns:
      - pattern-either:
          - pattern: new FileInputStream(...)
          - pattern: new FileOutputStream(...)
          - pattern: $DB.getWritableDatabase()
          - pattern: $DB.getReadableDatabase()
          - pattern: $DB.rawQuery(...)
          - pattern: $DB.query(...)
          - pattern: Thread.sleep(...)
      - pattern-inside: |
          public void onReceive(Context $CTX, Intent $INTENT) {
            ...
          }
    paths:
      include:
        - "**/*.java"
    metadata:
      rule_id: R-PRF-016
      category: perf/heavy-onreceive
      severity: major

  - id: scan-android-r-prf-016-heavy-onreceive-kt
    languages: [kotlin]
    severity: WARNING
    message: "R-PRF-016: onReceive 运行在主线程，其中不应有重 I/O 或耗时操作"
    patterns:
      - pattern-either:
          - pattern: FileInputStream(...)
          - pattern: FileOutputStream(...)
          - pattern: $DB.getWritableDatabase()
          - pattern: $DB.getReadableDatabase()
          - pattern: $DB.rawQuery(...)
          - pattern: Thread.sleep(...)
      - pattern-inside: |
          override fun onReceive($CTX: Context, $INTENT: Intent) {
            ...
          }
    paths:
      include:
        - "**/*.kt"
    metadata:
      rule_id: R-PRF-016
      category: perf/heavy-onreceive
      severity: major
