rules:
  # ============================================================
  # R-SEC-001: 硬编码密钥
  # ============================================================
  - id: scan-android-r-sec-001-hardcoded-secret-java
    languages: [java, kotlin]
    severity: ERROR
    message: "R-SEC-001: 检测到可能的硬编码密钥"
    pattern-regex: '(?i)\b(api[_\-]?key|secret|password|access[_\-]?key|private[_\-]?key|auth[_\-]?token|bearer)\s*[:=]\s*"[^"]{8,}"'
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
      exclude:
        - "**/test/**"
        - "**/androidTest/**"
        - "**/*.example.*"
        - "**/*Test*"
    metadata:
      rule_id: R-SEC-001
      category: security/hardcoded-secret
      severity: critical

  - id: scan-android-r-sec-001-hardcoded-secret-props
    languages: [yaml]
    severity: ERROR
    message: "R-SEC-001: 检测到可能的硬编码密钥（properties/gradle 文件）"
    pattern-regex: '(?i)(api[_\-]?key|secret|password|access[_\-]?key|private[_\-]?key|auth[_\-]?token|bearer)\s*[=:]\s*[^\s]{8,}'
    paths:
      include:
        - "**/*.properties"
        - "**/*.gradle"
        - "**/*.gradle.kts"
      exclude:
        - "**/test/**"
    metadata:
      rule_id: R-SEC-001
      category: security/hardcoded-secret
      severity: critical

  # ============================================================
  # R-SEC-002: 弱加密/弱哈希算法
  # ============================================================
  - id: scan-android-r-sec-002-weak-crypto
    languages: [java, kotlin]
    severity: ERROR
    message: "R-SEC-002: 使用弱加密或弱哈希算法"
    pattern: $X.getInstance("...")
    metavariable-regex:
      metavariable: "..."
      regex: "^(DES|RC4|MD5|SHA-?1|AES/ECB/.*)"
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    metadata:
      rule_id: R-SEC-002
      category: security/weak-crypto
      severity: critical

  # ============================================================
  # R-SEC-003: TLS 信任所有证书（Java）
  # ============================================================
  - id: scan-android-r-sec-003-trust-all-java
    languages: [java]
    severity: ERROR
    message: "R-SEC-003: checkServerTrusted 方法体为空，信任所有证书"
    pattern: |
      public void checkServerTrusted(java.security.cert.X509Certificate[] $CHAIN, String $TYPE) throws java.security.cert.CertificateException {
      }
    paths:
      include:
        - "**/*.java"
    metadata:
      rule_id: R-SEC-003
      category: security/tls-trust-all
      severity: critical

  - id: scan-android-r-sec-003-trust-all-kt
    languages: [kotlin]
    severity: ERROR
    message: "R-SEC-003: checkServerTrusted 实现为空，信任所有证书"
    pattern: |
      override fun checkServerTrusted($CHAIN: Array<java.security.cert.X509Certificate>, $TYPE: String) {
      }
    paths:
      include:
        - "**/*.kt"
    metadata:
      rule_id: R-SEC-003
      category: security/tls-trust-all
      severity: critical

  - id: scan-android-r-sec-003-hostname-verifier
    languages: [java, kotlin]
    severity: ERROR
    message: "R-SEC-003: HostnameVerifier 永久返回 true"
    pattern-regex: 'HostnameVerifier[^{]*\{[^}]*return\s+true'
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    metadata:
      rule_id: R-SEC-003
      category: security/tls-trust-all
      severity: critical

  # ============================================================
  # R-SEC-004: WebView 不安全配置
  # ============================================================
  - id: scan-android-r-sec-004-webview-js-enabled
    languages: [java, kotlin]
    severity: WARNING
    message: "R-SEC-004: WebView 开启了 JavaScript"
    patterns:
      - pattern: $WEBVIEW.getSettings().setJavaScriptEnabled(true)
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    metadata:
      rule_id: R-SEC-004
      category: security/webview
      severity: major

  - id: scan-android-r-sec-004-webview-file-access
    languages: [java, kotlin]
    severity: ERROR
    message: "R-SEC-004: WebView 允许文件访问"
    patterns:
      - pattern-either:
          - pattern: $WS.setAllowFileAccess(true)
          - pattern: $WS.setAllowFileAccessFromFileURLs(true)
          - pattern: $WS.setAllowUniversalAccessFromFileURLs(true)
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    metadata:
      rule_id: R-SEC-004
      category: security/webview
      severity: major

  - id: scan-android-r-sec-004-webview-addjavascript-interface
    languages: [java, kotlin]
    severity: WARNING
    message: "R-SEC-004: addJavascriptInterface 暴露 Java 对象到 WebView"
    pattern: $WV.addJavascriptInterface(...)
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    metadata:
      rule_id: R-SEC-004
      category: security/webview
      severity: major

  # ============================================================
  # R-SEC-005: 明文 HTTP
  # ============================================================
  - id: scan-android-r-sec-005-cleartext-traffic-manifest
    languages: [xml]
    severity: WARNING
    message: "R-SEC-005: manifest 中 usesCleartextTraffic=true"
    pattern-regex: 'android:usesCleartextTraffic\s*=\s*"true"'
    paths:
      include:
        - "**/AndroidManifest.xml"
        - "**/network_security_config.xml"
    metadata:
      rule_id: R-SEC-005
      category: security/cleartext
      severity: major

  - id: scan-android-r-sec-005-cleartext-http-url
    languages: [java, kotlin]
    severity: WARNING
    message: "R-SEC-005: 代码中存在 HTTP 明文 URL"
    pattern-regex: '"http://[^"]{4,}"'
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    metadata:
      rule_id: R-SEC-005
      category: security/cleartext
      severity: major

  # ============================================================
  # R-SEC-006: PendingIntent 缺失 mutability 标志
  # ============================================================
  - id: scan-android-r-sec-006-pendingintent-mutability
    languages: [java, kotlin]
    severity: WARNING
    message: "R-SEC-006: PendingIntent 调用，需确认 FLAG_IMMUTABLE 或 FLAG_MUTABLE"
    patterns:
      - pattern-either:
          - pattern: PendingIntent.getActivity(...)
          - pattern: PendingIntent.getBroadcast(...)
          - pattern: PendingIntent.getService(...)
          - pattern: PendingIntent.getActivities(...)
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    metadata:
      rule_id: R-SEC-006
      category: security/pendingintent-mutability
      severity: major

  # ============================================================
  # R-SEC-007: 导出组件未加权限保护
  # ============================================================
  - id: scan-android-r-sec-007-exported-unprotected
    languages: [xml]
    severity: ERROR
    message: "R-SEC-007: 组件设置 exported=true，需确认是否有权限保护"
    pattern-regex: 'android:exported\s*=\s*"true"'
    paths:
      include:
        - "**/AndroidManifest.xml"
    metadata:
      rule_id: R-SEC-007
      category: security/exported-unprotected
      severity: critical

  # ============================================================
  # R-SEC-008: 世界可读/可写文件
  # ============================================================
  - id: scan-android-r-sec-008-world-readable
    languages: [java, kotlin]
    severity: ERROR
    message: "R-SEC-008: 使用已废弃的 MODE_WORLD_READABLE/WRITEABLE"
    pattern-regex: 'MODE_WORLD_(READABLE|WRITEABLE)'
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    metadata:
      rule_id: R-SEC-008
      category: security/world-readable
      severity: critical

  # ============================================================
  # R-SEC-009: 用于安全目的的不安全随机
  # ============================================================
  - id: scan-android-r-sec-009-weak-random-java
    languages: [java]
    severity: WARNING
    message: "R-SEC-009: 使用 java.util.Random，可能不适合安全用途"
    pattern: new Random()
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    metadata:
      rule_id: R-SEC-009
      category: security/weak-random
      severity: major

  - id: scan-android-r-sec-009-math-random
    languages: [java, kotlin]
    severity: WARNING
    message: "R-SEC-009: Math.random() 不适合安全用途"
    pattern: Math.random()
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    metadata:
      rule_id: R-SEC-009
      category: security/weak-random
      severity: major

  # ============================================================
  # R-SEC-010: 日志中的敏感数据
  # ============================================================
  - id: scan-android-r-sec-010-log-leakage
    languages: [java, kotlin]
    severity: WARNING
    message: "R-SEC-010: 日志中可能包含敏感数据（token/password/location 等）"
    pattern-regex: '\bLog\.(v|d|i|w|e|wtf)\s*\([^)]*\b(vin|imei|token|password|phone|latitude|longitude|location|uid|deviceId|mac)\b'
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    metadata:
      rule_id: R-SEC-010
      category: security/log-leakage
      severity: major

  # ============================================================
  # R-SEC-011: SQL 注入（字符串拼接进 rawQuery/execSQL）
  # ============================================================
  - id: scan-android-r-sec-011-sql-injection-java
    languages: [java]
    severity: ERROR
    message: "R-SEC-011: rawQuery/execSQL 使用字符串拼接，可能存在 SQL 注入"
    patterns:
      - pattern-either:
          - pattern: $DB.rawQuery("..." + $X, $ARGS)
          - pattern: $DB.execSQL("..." + $X)
          - pattern: $DB.rawQuery($SQL + $X, $ARGS)
          - pattern: $DB.execSQL($SQL + $X)
    paths:
      include:
        - "**/*.java"
    metadata:
      rule_id: R-SEC-011
      category: security/sql-injection
      severity: critical

  - id: scan-android-r-sec-011-sql-injection-kt
    languages: [kotlin]
    severity: ERROR
    message: "R-SEC-011: rawQuery/execSQL 使用字符串拼接或模板，可能存在 SQL 注入"
    patterns:
      - pattern-either:
          - pattern: $DB.rawQuery("...$X...", $ARGS)
          - pattern: $DB.execSQL("...$X...")
          - pattern: $DB.rawQuery($SQL + $X, $ARGS)
    paths:
      include:
        - "**/*.kt"
    metadata:
      rule_id: R-SEC-011
      category: security/sql-injection
      severity: critical

  # ============================================================
  # R-SEC-012: 命令注入（Runtime.exec / ProcessBuilder）
  # ============================================================
  - id: scan-android-r-sec-012-command-injection
    languages: [java, kotlin]
    severity: ERROR
    message: "R-SEC-012: Runtime.exec 或 ProcessBuilder 使用动态参数"
    patterns:
      - pattern-either:
          - pattern: Runtime.getRuntime().exec(...)
          - pattern: new ProcessBuilder(...)
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    metadata:
      rule_id: R-SEC-012
      category: security/command-injection
      severity: critical

  # ============================================================
  # R-SEC-013: 导出的 IPC/AIDL 接口缺少调用方校验
  # ============================================================
  - id: scan-android-r-sec-013-ipc-caller-unverified-java
    languages: [java]
    severity: ERROR
    message: "R-SEC-013: AIDL Stub 实现，需确认所有特权方法都校验了调用方"
    pattern: class $C extends $IFACE.Stub { ... }
    paths:
      include:
        - "**/*.java"
    metadata:
      rule_id: R-SEC-013
      category: security/ipc-caller-unverified
      severity: critical

  # ============================================================
  # R-SEC-014: debuggable 开启
  # ============================================================
  - id: scan-android-r-sec-014-debuggable-manifest
    languages: [xml]
    severity: ERROR
    message: "R-SEC-014: manifest 中 android:debuggable=true"
    pattern-regex: 'android:debuggable\s*=\s*"true"'
    paths:
      include:
        - "**/AndroidManifest.xml"
    metadata:
      rule_id: R-SEC-014
      category: security/debuggable-enabled
      severity: critical

  - id: scan-android-r-sec-014-debuggable-gradle
    languages: [kotlin]
    severity: ERROR
    message: "R-SEC-014: build.gradle 中 debuggable true（可能在 release buildType）"
    pattern-regex: '^\s*debuggable\s+true\b'
    paths:
      include:
        - "**/*.gradle"
        - "**/*.gradle.kts"
    metadata:
      rule_id: R-SEC-014
      category: security/debuggable-enabled
      severity: critical

  # ============================================================
  # R-SEC-015: allowBackup 允许 adb 导出
  # ============================================================
  - id: scan-android-r-sec-015-allow-backup
    languages: [xml]
    severity: WARNING
    message: "R-SEC-015: android:allowBackup=true 允许 adb 导出私有数据"
    pattern-regex: 'android:allowBackup\s*=\s*"true"'
    paths:
      include:
        - "**/AndroidManifest.xml"
    metadata:
      rule_id: R-SEC-015
      category: security/backup-allowed
      severity: major

  # ============================================================
  # R-SEC-016: Intent 重定向
  # ============================================================
  - id: scan-android-r-sec-016-intent-redirection
    languages: [java, kotlin]
    severity: ERROR
    message: "R-SEC-016: 从 extra 中取出的对象可能被用作 Intent 转发（Intent 重定向）"
    patterns:
      - pattern-either:
          - pattern: $I.getParcelableExtra(...)
          - pattern: $I.getSerializableExtra(...)
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    metadata:
      rule_id: R-SEC-016
      category: security/intent-redirection
      severity: critical

  # ============================================================
  # R-SEC-017: 动态注册 receiver 缺失导出标志
  # ============================================================
  - id: scan-android-r-sec-017-receiver-export-flag
    languages: [java, kotlin]
    severity: WARNING
    message: "R-SEC-017: registerReceiver 调用，targetSdk>=34 需要明确传入 RECEIVER_EXPORTED 或 RECEIVER_NOT_EXPORTED"
    pattern-either:
      - pattern: $CTX.registerReceiver($R, $F)
      - pattern: $CTX.registerReceiver($R, $F, $PERM, $H)
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    metadata:
      rule_id: R-SEC-017
      category: security/receiver-export-flag
      severity: major

  # ============================================================
  # R-SEC-018: 导出的 ContentProvider 无权限保护
  # ============================================================
  - id: scan-android-r-sec-018-exported-provider
    languages: [xml]
    severity: ERROR
    message: "R-SEC-018: ContentProvider 设置 exported=true，需确认是否有权限保护"
    pattern-regex: '<provider\b[^>]*android:exported\s*=\s*"true"'
    paths:
      include:
        - "**/AndroidManifest.xml"
    metadata:
      rule_id: R-SEC-018
      category: security/exported-provider
      severity: critical

  # ============================================================
  # R-SEC-019: 不安全反序列化/动态代码加载
  # ============================================================
  - id: scan-android-r-sec-019-unsafe-deserialize
    languages: [java, kotlin]
    severity: WARNING
    message: "R-SEC-019: ObjectInputStream 反序列化，需确认输入来源是否可信"
    pattern: new ObjectInputStream(...)
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    metadata:
      rule_id: R-SEC-019
      category: security/unsafe-deserialization
      severity: major

  - id: scan-android-r-sec-019-dynamic-dex-load
    languages: [java, kotlin]
    severity: ERROR
    message: "R-SEC-019: 动态代码加载（DexClassLoader），需确认来源安全性"
    patterns:
      - pattern-either:
          - pattern: new DexClassLoader(...)
          - pattern: new InMemoryDexClassLoader(...)
          - pattern: System.load(...)
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    metadata:
      rule_id: R-SEC-019
      category: security/unsafe-deserialization
      severity: critical

  # ============================================================
  # R-SEC-020: 敏感数据写入外部存储
  # ============================================================
  - id: scan-android-r-sec-020-sensitive-external-storage
    languages: [java, kotlin]
    severity: WARNING
    message: "R-SEC-020: 使用外部存储路径，敏感数据不应写入外部存储"
    patterns:
      - pattern-either:
          - pattern: $CTX.getExternalStorageDirectory()
          - pattern: $CTX.getExternalStoragePublicDirectory(...)
          - pattern: $CTX.getExternalFilesDir(...)
          - pattern: $CTX.getExternalCacheDir()
          - pattern: Environment.getExternalStorageDirectory()
          - pattern: Environment.getExternalStoragePublicDirectory(...)
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    metadata:
      rule_id: R-SEC-020
      category: security/sensitive-external-storage
      severity: major
